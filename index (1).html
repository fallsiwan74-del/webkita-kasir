<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5ed7">
<title>WebKasir Kita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5ed7'/%3E%3Cpath d='M12 18h12l8 22 8-22h12L38 50H26z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--navy:#0a2463;--blue:#1677ff;--blue2:#0b5ed7;--bg:#f3f6fc;--card:#fff;--text:#0f1b3d;--mut:#6b7794;--line:#e3e9f4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px;--sh:0 4px 18px rgba(10,36,99,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
h2,h3{margin:0 0 6px}h2{font-size:22px}h3{font-size:16px}
p{margin:0 0 8px}.mut{color:var(--mut)}.small{font-size:12.5px}.right{text-align:right}.grow{flex:1}
.row{display:flex;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.gap{gap:10px}.col{display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
.btn{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:10px 16px;border-radius:11px;font-weight:600;box-shadow:0 3px 10px rgba(22,119,255,.28);transition:.15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--blue2);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 3px 10px rgba(220,38,38,.25)}
.btn.green{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 3px 10px rgba(22,163,74,.25)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:0;background:transparent;font-size:19px;padding:6px 9px;border-radius:10px;position:relative}
.icon:hover{background:#eaf1ff}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);outline:none}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.15)}
.in.sm{width:90px}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:12px;color:#33405f}
label.f .in{margin-top:5px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.stats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.stat .l{color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
.stat .v{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.stat.hl{background:linear-gradient(135deg,#0a2463,#0b5ed7);color:#fff;border:0}.stat.hl .l{color:#cfe0ff}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.chartbox{position:relative;height:270px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#f0f5ff;text-align:left;padding:9px 11px;white-space:nowrap;color:#33405f;position:sticky;top:0}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafcff}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.toolbar label{font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sh);transition:.15s;color:var(--text)}
.tile:hover{border-color:var(--blue);transform:translateY(-2px)}
.tile:active{transform:scale(.96);background:#eaf3ff}
.tile.off{opacity:.45;cursor:not-allowed}
.tile.flash{animation:fl .5s}@keyframes fl{0%{background:#bbf7d0}100%{background:#fff}}
.tn{font-weight:700;margin-bottom:4px}.tp{font-size:18px;font-weight:800;color:var(--blue2)}.tm{font-size:12px;color:var(--mut);margin:2px 0}.ts{font-size:12px;font-weight:600;color:var(--ok)}.ts.low{color:var(--warn)}.ts.zero{color:var(--bad)}
.empty{text-align:center;padding:34px 10px;color:var(--mut)}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:255px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand .w{color:var(--navy)}.brand .k{color:var(--blue)}
.nav{flex:1;overflow:auto;padding:6px 10px}
.nav button{width:100%;display:flex;gap:11px;align-items:center;border:0;background:transparent;padding:10px 12px;border-radius:11px;color:#33405f;font-weight:600;text-align:left;margin-bottom:2px}
.nav button:hover{background:#eef4ff}.nav button.on{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 3px 10px rgba(22,119,255,.25)}
.nav .lk{margin-left:auto;font-size:12px}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);padding:12px 12px 4px}
.content{margin-left:255px;flex:1;min-width:0}
.top{position:sticky;top:0;z-index:40;background:rgba(243,246,252,.9);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line)}
.top .ttl{font-weight:800;font-size:17px}
.ham{display:none}
#main{padding:20px;max-width:1280px}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--blue2);color:#fff;font-weight:800;overflow:hidden;padding:0;box-shadow:0 0 0 1.5px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
#bellN{position:absolute;top:0;right:0;background:#ef4444;color:#fff;border-radius:99px;font-size:10.5px;padding:1px 5px;min-width:17px;font-style:normal}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;white-space:nowrap}
.chip.bad{background:#fee2e2;color:#991b1b}
.backdrop{display:none;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:55}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.backdrop.open{display:block}.content{margin-left:0}.ham{display:inline-block}#main{padding:14px}.top{padding:8px 12px}}
/* auth */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:linear-gradient(150deg,#0a2463,#0b5ed7 60%,#35a1ff);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:34px;line-height:1.15;margin:18px 0 12px;letter-spacing:-.8px}
.hero li{margin:8px 0}
.authbox{display:flex;align-items:center;justify-content:center;padding:26px}
.authbox .card{width:100%;max-width:430px;padding:26px}
.tabs{display:flex;background:#eef3fc;border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--blue2);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.err{background:#fee2e2;color:#991b1b;padding:9px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.gbtn{display:flex;gap:9px;justify-content:center;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;font-weight:600}
@media(max-width:860px){.authwrap{grid-template-columns:1fr}.hero{padding:26px}.hero h1{font-size:25px}}
/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:640px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mb{padding:18px}.mb .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100vw - 24px);pointer-events:none}
.toast{background:#0a2463;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;animation:ti .25s;max-width:480px}
.toast.bad{background:#b91c1c}.toast.ok{background:#15803d}
@keyframes ti{from{opacity:0;transform:translateY(10px)}}
/* notif */
.nt{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.nt:last-child{border:0}.nt.unread{background:#f3f8ff}
.nt .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:#eaf1ff}
.nt.t-bad .ic{background:#fee2e2}.nt.t-warn .ic{background:#fef3c7}.nt.t-ok .ic{background:#dcfce7}
.nt .dot{position:absolute;right:12px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;padding:6px 13px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mut)}
.chips button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.plan{border:2px solid var(--line);border-radius:18px;padding:20px;background:#fff;position:relative}
.plan.best{border-color:var(--blue)}.plan .tag{position:absolute;top:-12px;right:16px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px}
.plan .pr{font-size:28px;font-weight:800;margin:6px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:2px;color:var(--navy);background:#eaf1ff;padding:8px 14px;border-radius:11px;display:inline-block}
.linkbox{display:flex;gap:8px}.linkbox .in{font-family:ui-monospace,monospace;font-size:13px}
.ph{width:92px;height:92px;border-radius:50%;background:var(--blue2);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.ph img{width:100%;height:100%;object-fit:cover}
.locked{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 14px;border-radius:12px;margin-bottom:14px}
/* tour */
.tblock{position:fixed;inset:0;z-index:2000;pointer-events:none}
.thole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,20,60,.64);pointer-events:none;z-index:2001;transition:all .28s;outline:3px solid rgba(255,255,255,.9)}
.tpop{position:fixed;z-index:2002;width:min(350px,calc(100vw - 24px));background:#fff;border-radius:18px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:ti .25s}
.tpop h4{margin:0 0 6px;font-size:17px;color:var(--navy)}.tpop p{color:#445}
.tdots{display:flex;gap:4px;margin:10px 0}.tdots i{height:5px;flex:1;border-radius:9px;background:#dbe5f6}.tdots i.on{background:var(--blue)}
.spin{width:38px;height:38px;border:4px solid #dbe5f6;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
#report{background:#fff;padding:18px;border:1px solid var(--line);border-radius:12px}
@media print{.side,.top{display:none}.content{margin:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="tourRoot"></div>
<div id="toasts"></div>
<noscript>Aktifkan JavaScript untuk memakai WebKasir Kita.</noscript>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAnalytics,isSupported} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,GoogleAuthProvider,signInWithPopup,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,onSnapshot,query,orderBy,where,limit,getDocs,deleteDoc,runTransaction,writeBatch,increment} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====================== KONFIGURASI ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyAz5a7xClRM_fZU519pZsXG2eCZKpelQEI",
  authDomain: "webkita-kasir-v1.firebaseapp.com",
  projectId: "webkita-kasir-v1",
  storageBucket: "webkita-kasir-v1.firebasestorage.app",
  messagingSenderId: "116825072876",
  appId: "1:116825072876:web:46fbb4a3e8662b161831c9",
  measurementId: "G-72LCJML2XQ"
};
const CONFIG = {
  ADMIN_EMAIL: "GANTI_EMAIL_ADMIN@contoh.com",   // <- email akun admin (untuk konfirmasi pembayaran & penarikan)
  WHATSAPP_ADMIN: "628xxxxxxxxxx",               // <- nomor WA admin, format 62...
  PAY_INFO: "Transfer ke: [NAMA BANK] [NO. REKENING] a.n. [NAMA PEMILIK]",
  FREE_SLOTS: 30, TRIAL_MONTHS: 3,
  PRICE_MONTH: 79000, PRICE_YEAR: 499000,
  COMMISSION: 0.25, MIN_WITHDRAW: 50000
};
/* ========================================================== */

const app = initializeApp(firebaseConfig);
isSupported().then(ok=>{ if(ok) getAnalytics(app); }).catch(()=>{});
const auth = getAuth(app), db = getFirestore(app);

/* ---------- util ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ds(new Date());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.round(Number(n)||0);return (n<0?"-":"")+"Rp"+Math.abs(n).toLocaleString("id-ID")};
const num=v=>Math.max(0,Number(v)||0);
const fmtDate=s=>s?new Date(s+"T00:00").toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"";
const fmtFull=ts=>new Date(ts).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const fmtHM=ts=>new Date(ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const isMobile=()=>matchMedia("(max-width:900px)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg,kind=""){const t=document.createElement("div");t.className="toast "+kind;t.textContent=msg;$("#toasts").appendChild(t);setTimeout(()=>t.remove(),3200)}
function logo(s=40){return `<svg width="${s}" height="${s}" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b4fb3"/><stop offset="1" stop-color="#06265f"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1677ff"/><stop offset="1" stop-color="#3fa8ff"/></linearGradient></defs><path d="M10 34c-1-3 1-5 4-5h22c4 0 7 2 9 6l22 44c2 4-1 8-5 8-3 0-5-1-8 2L50 100c-6 5-13 3-17-4z" fill="url(#lg1)"/><path d="M50 56c4-6 12-6 17 0l15 24c3 5 0 10-5 14-7 5-14 3-19-4L48 66c-2-3-1-7 2-10z" fill="url(#lg2)"/><path d="M78 56c4-5 9-8 16-8h13l-22 36c-3 4-8 2-9-2z" fill="#0b5ed7"/><path d="M66 22 72 6h26c8 0 12 4 11 10l-10 30H70z" fill="#fff" stroke="#1677ff" stroke-width="5" stroke-linejoin="round"/><path d="M76 20h22M76 29h18M76 38h10" stroke="#1677ff" stroke-width="5" stroke-linecap="round"/></svg>`}
const brandHtml=(s=36)=>`${logo(s)}<span><span class="w">Web</span><span class="k">Kasir</span> <span class="w">Kita</span></span>`;

/* ---------- state ---------- */
const S={user:null,P:null,products:[],sales:[],expenses:[],notifs:[],referrals:[],payments:[],payouts:[],adminPay:[],adminPayouts:[],page:"dashboard",range:"month",sRange:"month",sQ:"",eRange:"month",nFilter:"all",kQty:1,kDate:"",kMethod:"Tunai",kQ:"",unsubs:[],tour:false,fails:0,lockUntil:0,dirty:false,onModalClose:null,rpt:{range:"month",type:"both",from:"",to:""},charts:{}};
const isAdmin=()=>S.user&&S.user.email&&S.user.email.toLowerCase()===CONFIG.ADMIN_EMAIL.toLowerCase();
const uid=()=>S.user.uid;
const col=n=>collection(db,"users",uid(),n);
const active=()=>S.P&&(S.P.plan?.expiresAt||0)>Date.now();
const daysLeft=()=>Math.ceil(((S.P?.plan?.expiresAt||0)-Date.now())/864e5);

/* ---------- notifikasi ---------- */
const NT={welcome:["🎉","ok"],info:["ℹ️",""],login:["🔐",""],penjualan:["🧾","ok"],pengeluaran:["💸",""],produk:["📦",""],stok_menipis:["⚠️","warn"],stok_habis:["⛔","bad"],stok:["🗃️",""],hapus_percobaan:["🚨","warn"],hapus_batal:["↩️",""],hapus_transaksi:["🗑️","bad"],sandi_salah:["❌","bad"],keamanan:["🛡️","warn"],premium:["⭐","warn"],premium_habis:["⛔","bad"],referral:["🎁","ok"],ekspor:["📤",""],pengaturan:["⚙️",""],pembayaran:["💳","ok"]};
const NGROUP={transaksi:["penjualan","pengeluaran","hapus_transaksi","stok","produk"],keamanan:["hapus_percobaan","hapus_batal","sandi_salah","keamanan","hapus_transaksi","login"],stok:["stok_menipis","stok_habis","stok"],akun:["welcome","premium","premium_habis","referral","pembayaran","pengaturan","ekspor","info"]};
function notify(type,title,body,meta){return addDoc(col("notifications"),{type,title,body:body||"",ts:Date.now(),read:false,meta:meta||{}}).catch(e=>console.warn("notif",e))}
async function onceNotif(id,type,title,body){try{const r=doc(db,"users",uid(),"notifications",id);if((await getDoc(r)).exists())return;await setDoc(r,{type,title,body:body||"",ts:Date.now(),read:false,meta:{}})}catch(e){console.warn(e)}}

/* ---------- modal ---------- */
function modal(title,body,opt={}){const r=$("#modalRoot");S.onModalClose=opt.onClose||null;r.innerHTML=`<div class="mback" ${opt.sticky?"":'data-act="mclose"'}><div class="modal ${opt.wide?"wide":""}"><div class="mh"><h3>${title}</h3><button class="icon" data-act="mclose" data-x="1">✕</button></div><div class="mb">${body}</div></div></div>`;if(opt.mount)opt.mount(r);const f=$("input,select",r);if(f&&!opt.noFocus)setTimeout(()=>f.focus(),60)}
function closeModal(silent){const cb=S.onModalClose;S.onModalClose=null;$("#modalRoot").innerHTML="";if(cb&&!silent)cb()}
function ask(title,msg,ok="Ya",cls=""){return new Promise(res=>{modal(title,`<p>${msg}</p><div class="actions"><button class="btn ghost" id="aNo">Batal</button><button class="btn ${cls}" id="aYes">${ok}</button></div>`,{noFocus:1,mount:r=>{$("#aNo",r).onclick=()=>{closeModal(1);res(false)};$("#aYes",r).onclick=()=>{closeModal(1);res(true)}}})})}

/* ---------- sandi hapus (PBKDF2) ---------- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPw(pw,saltHex){const salt=saltHex?unhex(saltHex):crypto.getRandomValues(new Uint8Array(16));const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,256);return{salt:hex(salt),hash:hex(bits)}}
async function checkPw(pw){const d=S.P.deletePin;if(!d)return false;return(await hashPw(pw,d.salt)).hash===d.hash}

async function initProfile(user,{name,biz,ref}){
  ref=(ref||"").trim().toUpperCase();let refUid=null;
  if(ref){try{const r=await getDoc(doc(db,"referralCodes",ref));if(r.exists()&&r.data().uid!==user.uid)refUid=r.data().uid}catch(e){}}
  let code;for(let i=0;i<8;i++){code=genCode();const s=await getDoc(doc(db,"referralCodes",code));if(!s.exists())break}
  let trial=false;const exp=new Date();exp.setMonth(exp.getMonth()+CONFIG.TRIAL_MONTHS);
  await runTransaction(db,async tx=>{
    const cref=doc(db,"meta","counter");const cs=await tx.get(cref);const c=cs.exists()?(cs.data().count||0):0;
    trial=c<CONFIG.FREE_SLOTS;if(trial)tx.set(cref,{count:c+1});
    tx.set(doc(db,"users",user.uid),{ownerName:name||user.displayName||"",businessName:biz||"",branchName:"",address:"",phone:"",photo:"",email:user.email||"",openingBalance:0,
      plan:trial?{type:"trial",expiresAt:exp.getTime()}:{type:"none",expiresAt:0},referralCode:code,referredBy:refUid||"",referralBalance:0,referralEarned:0,deletePin:null,tourDone:false,createdAt:Date.now()});
  });
  await setDoc(doc(db,"referralCodes",code),{uid:user.uid,name:name||""});
  if(refUid)await addDoc(collection(db,"referrals"),{referrerUid:refUid,referredUid:user.uid,referredName:name||user.email||"Pengguna",status:"terdaftar",paidAmount:0,commission:0,createdAt:Date.now()});
  try{localStorage.removeItem("wk_ref")}catch(e){}
  S.user=user;
  await notify("welcome","Selamat datang di WebKasir Kita! 🎉",trial?`Akun dibuat. Anda mendapat GRATIS ${CONFIG.TRIAL_MONTHS} bulan (slot gratis ${CONFIG.FREE_SLOTS} pendaftar pertama). Mulai dari menu Produk, lalu catat penjualan di Kasir.`:"Akun dibuat. Slot gratis sudah habis; pilih paket di menu Langganan untuk mulai mencatat.");
  if(refUid)await notify("referral","Terdaftar lewat kode referal","Anda mendaftar menggunakan kode referal "+ref+".");
}

const busyTile={};
async function recordSale(p,qty,date,method){
  if(!active())return lockMsg();
  if(p.stock<qty)return toast(`Stok ${p.name} tidak cukup (sisa ${p.stock})`,"bad");
  const data={productId:p.id,name:p.name,cost:p.cost,price:p.price,qty,revenue:p.price*qty,hpp:p.cost*qty,profit:(p.price-p.cost)*qty,date,ts:Date.now(),method};
  const b=writeBatch(db);b.set(doc(col("sales")),data);b.update(doc(col("products"),p.id),{stock:increment(-qty)});
  try{await b.commit()}catch(e){return toast("Gagal mencatat: "+e.message,"bad")}
  toast(`✔ ${p.name} ×${qty} · Untung ${fmt(data.profit)}`,"ok");
  notify("penjualan","Penjualan dicatat: "+p.name,`${qty} × ${fmt(p.price)} = ${fmt(data.revenue)} · Modal ${fmt(data.hpp)} · Untung ${fmt(data.profit)} · ${fmtDate(date)} ${fmtHM(data.ts)} · ${method}`);
  const ns=p.stock-qty;
  if(ns<=0)notify("stok_habis","Stok habis: "+p.name,"Stok "+p.name+" sekarang 0. Segera restock.");
  else if(ns<=p.minStock)notify("stok_menipis","Stok menipis: "+p.name,`Sisa stok ${ns} (batas minimum ${p.minStock}).`);
}

/* ---------- Hapus transaksi (wajib sandi) ---------- */
function describe(kind,x){
  if(kind==="penjualan")return `Penjualan ${x.name} ×${x.qty} · Jual ${fmt(x.revenue)} · Untung ${fmt(x.profit)} · Tgl ${fmtDate(x.date)} ${fmtHM(x.ts)}`;
  if(kind==="pengeluaran")return `Pengeluaran ${x.category}: ${x.desc} · ${fmt(x.amount)} · Tgl ${fmtDate(x.date)} ${fmtHM(x.ts)}`;
  return `Produk ${x.name} · Modal ${fmt(x.cost)} · Jual ${fmt(x.price)} · Stok ${x.stock}`}
A.del=el=>{
  const kind=el.dataset.kind,id=el.dataset.id,item=(kind==="penjualan"?S.sales:kind==="pengeluaran"?S.expenses:S.products).find(x=>x.id===id);if(!item)return;
  const d=describe(kind,item);
  notify("hapus_percobaan","⚠️ Percobaan penghapusan "+kind,`${d} · Tombol hapus diklik pada ${fmtFull(Date.now())}`,{kind,id});
  if(!S.P.deletePin){modal("Buat sandi hapus dulu",`<p>Untuk melindungi data, penghapusan hanya bisa dilakukan dengan <b>sandi hapus</b> buatan Anda. Buat sandi sekarang, lalu ulangi penghapusan.</p><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Nanti</button><button class="btn" data-act="pwCreate">Buat Sandi</button></div>`,{onClose:()=>notify("hapus_batal","Penghapusan dibatalkan",d)});return}
  modal("Verifikasi Sandi Hapus",`<div class="locked" style="background:#fef2f2;border-color:#fecaca;color:#991b1b">🗑️ ${esc(d)}</div><label class="f">Masukkan sandi hapus<input id="dPw" class="in" type="password" autocomplete="off"></label><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Batal</button><button class="btn red" data-act="doDel" data-kind="${kind}" data-id="${id}">Hapus Permanen</button></div>`,{onClose:()=>notify("hapus_batal","Penghapusan dibatalkan",d)});
};
A.doDel=async el=>{
  const kind=el.dataset.kind,id=el.dataset.id,item=(kind==="penjualan"?S.sales:kind==="pengeluaran"?S.expenses:S.products).find(x=>x.id===id);if(!item)return closeModal(1);
  const d=describe(kind,item);
  if(Date.now()<S.lockUntil)return toast(`Terkunci. Coba lagi ${Math.ceil((S.lockUntil-Date.now())/1000)} detik lagi.`,"bad");
  const pw=$("#dPw").value;if(!pw)return toast("Masukkan sandi","bad");el.disabled=true;
  if(!(await checkPw(pw))){S.fails++;el.disabled=false;notify("sandi_salah","❌ Sandi hapus salah",`Percobaan ke-${S.fails} pada ${fmtFull(Date.now())}. Target: ${d}`);
    if(S.fails>=5){S.lockUntil=Date.now()+60000;S.fails=0;notify("keamanan","Penghapusan dikunci 60 detik","5 kali salah memasukkan sandi hapus.");toast("5x salah. Penghapusan dikunci 60 detik.","bad")}else toast("Sandi salah","bad");$("#dPw").value="";$("#dPw").focus();return}
  S.fails=0;
  try{
    if(kind==="penjualan"){const b=writeBatch(db);b.delete(doc(col("sales"),id));const p=S.products.find(x=>x.id===item.productId);if(p)b.update(doc(col("products"),p.id),{stock:increment(Number(item.qty))});await b.commit()}
    else await deleteDoc(doc(col(kind==="pengeluaran"?"expenses":"products"),id));
  }catch(e){el.disabled=false;return toast("Gagal menghapus: "+e.message,"bad")}
  closeModal(1);toast("Data dihapus","ok");
  notify("hapus_transaksi","🗑️ "+kind[0].toUpperCase()+kind.slice(1)+" dihapus",`${d} · Dihapus ${fmtFull(Date.now())} dengan sandi terverifikasi${kind==="penjualan"&&S.products.find(x=>x.id===item.productId)?` · Stok dikembalikan +${item.qty}`:""}`);
};

/* ---------- Laporan & Ekspor ---------- */
function reportData(){const r=S.rpt;let f,t;if(r.range==="custom"){f=r.from||"0000-00-00";t=r.to||todayStr()}else[f,t]=rangeFor(r.range);
  return{f,t,sales:r.type!=="exp"?inRange(S.sales,f,t).slice().reverse():[],exp:r.type!=="sales"?inRange(S.expenses,f,t).slice().reverse():[]}}
function reportHtml(){const d=reportData(),s=calc(inRange(S.sales,d.f,d.t),inRange(S.expenses,d.f,d.t));const per=d.f==="0000-00-00"?"Semua waktu":fmtDate(d.f)+" – "+fmtDate(d.t);
  return `<div id="report"><div class="row between wrap gap"><div><h3 style="margin:0">${esc(S.P.businessName||"Bisnis")} ${S.P.branchName?"· "+esc(S.P.branchName):""}</h3><div class="small mut">${esc(S.P.address||"")}</div></div><div class="right small mut">Laporan WebKasir Kita<br>${per}</div></div><hr style="border:0;border-top:1px solid var(--line)">
  <div class="grid stats" style="margin-top:10px">${stat("Omzet",fmt(s.omzet),"")}${stat("HPP",fmt(s.hpp),"")}${stat("Laba Kotor",fmt(s.gross),"")}${stat("Margin",s.margin.toFixed(1)+"%","")}${stat("Pengeluaran",fmt(s.expAll),"")}${stat("Laba Bersih",fmt(s.net),"")}</div>
  ${d.sales.length?`<h3>Penjualan</h3><div class="tw"><table><thead><tr><th>Tanggal</th><th>Produk</th><th class="right">Qty</th><th class="right">Modal</th><th class="right">Jual</th><th class="right">Untung</th></tr></thead><tbody>${d.sales.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.name)}</td><td class="right">${x.qty}</td><td class="right">${fmt(x.hpp)}</td><td class="right">${fmt(x.revenue)}</td><td class="right">${fmt(x.profit)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${d.exp.length?`<h3 style="margin-top:14px">Pengeluaran</h3><div class="tw"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="right">Jumlah</th></tr></thead><tbody>${d.exp.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.desc)}</td><td class="right">${fmt(x.amount)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${!d.sales.length&&!d.exp.length?'<div class="empty">Tidak ada data pada periode ini</div>':""}</div>`}
PAGES.laporan={title:"Laporan & Ekspor",html(){const r=S.rpt;return `<div class="card"><div class="toolbar"><label>Periode<select id="rR" class="in">${rangeOpts(r.range)}<option value="custom" ${r.range==="custom"?"selected":""}>Pilih tanggal</option></select></label>${r.range==="custom"?`<label>Dari<input id="rF" class="in" type="date" value="${r.from}"></label><label>Sampai<input id="rT" class="in" type="date" value="${r.to}"></label>`:""}<label>Data<select id="rY" class="in"><option value="both" ${r.type==="both"?"selected":""}>Penjualan + Pengeluaran</option><option value="sales" ${r.type==="sales"?"selected":""}>Penjualan saja</option><option value="exp" ${r.type==="exp"?"selected":""}>Pengeluaran saja</option></select></label></div>
  <div class="row gap wrap" id="exportBtns" style="margin-top:14px"><button class="btn" data-act="expCSV">⬇ CSV</button><button class="btn" data-act="expPDF">⬇ PDF</button><button class="btn" data-act="expImg">⬇ Gambar (PNG)</button></div></div>${reportHtml()}`},
  after(){$("#rR").onchange=e=>{S.rpt.range=e.target.value;renderPage(true)};$("#rY").onchange=e=>{S.rpt.type=e.target.value;renderPage(true)};const f=$("#rF"),t=$("#rT");if(f)f.onchange=e=>{S.rpt.from=e.target.value;renderPage(true)};if(t)t.onchange=e=>{S.rpt.to=e.target.value;renderPage(true)}}};
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const fname=ext=>"WebKasirKita-"+(S.P.businessName||"laporan").replace(/[^\w]+/g,"-")+"-"+todayStr()+"."+ext;
const csvCell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
A.expCSV=()=>{const d=reportData();const rows=[];
  if(d.sales.length){rows.push(["PENJUALAN"],["Tanggal","Jam","Produk","Qty","Harga Modal","Harga Jual","HPP","Omzet","Keuntungan","Metode"]);d.sales.forEach(x=>rows.push([x.date,fmtHM(x.ts),x.name,x.qty,x.cost,x.price,x.hpp,x.revenue,x.profit,x.method||""]));rows.push([])}
  if(d.exp.length){rows.push(["PENGELUARAN"],["Tanggal","Jam","Kategori","Keterangan","Jumlah"]);d.exp.forEach(x=>rows.push([x.date,fmtHM(x.ts),x.category,x.desc,x.amount]))}
  if(!rows.length)return toast("Tidak ada data untuk diunduh","bad");
  dl(new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),fname("csv"));toast("CSV diunduh","ok");notify("ekspor","Laporan diunduh (CSV)",`${d.sales.length} penjualan, ${d.exp.length} pengeluaran · ${fmtFull(Date.now())}`)};
A.expPDF=()=>{const d=reportData();if(!d.sales.length&&!d.exp.length)return toast("Tidak ada data untuk diunduh","bad");if(!window.jspdf)return toast("Pustaka PDF belum termuat","bad");
  const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"landscape"}),s=calc(inRange(S.sales,d.f,d.t),inRange(S.expenses,d.f,d.t));
  pdf.setFontSize(16);pdf.text(S.P.businessName||"Laporan",14,15);pdf.setFontSize(9);pdf.text((S.P.branchName?S.P.branchName+" · ":"")+(S.P.address||""),14,21);pdf.text("Periode: "+(d.f==="0000-00-00"?"Semua waktu":d.f+" s/d "+d.t),14,26);
  pdf.text(`Omzet ${fmt(s.omzet)}  |  HPP ${fmt(s.hpp)}  |  Laba kotor ${fmt(s.gross)}  |  Margin ${s.margin.toFixed(1)}%  |  Pengeluaran ${fmt(s.expAll)}  |  Laba bersih ${fmt(s.net)}`,14,32);
  let y=38;const hs={fillColor:[11,94,215]};
  if(d.sales.length){pdf.autoTable({startY:y,head:[["Tanggal","Produk","Qty","Modal","Jual","Untung","Metode"]],body:d.sales.map(x=>[x.date,x.name,x.qty,fmt(x.hpp),fmt(x.revenue),fmt(x.profit),x.method||""]),styles:{fontSize:8},headStyles:hs});y=pdf.lastAutoTable.finalY+8}
  if(d.exp.length){pdf.autoTable({startY:y,head:[["Tanggal","Kategori","Keterangan","Jumlah"]],body:d.exp.map(x=>[x.date,x.category,x.desc,fmt(x.amount)]),styles:{fontSize:8},headStyles:{fillColor:[220,38,38]}})}
  pdf.save(fname("pdf"));toast("PDF diunduh","ok");notify("ekspor","Laporan diunduh (PDF)",`${d.sales.length} penjualan, ${d.exp.length} pengeluaran · ${fmtFull(Date.now())}`)};
A.expImg=async()=>{if(!window.html2canvas)return toast("Pustaka gambar belum termuat","bad");toast("Membuat gambar...");const c=await html2canvas($("#report"),{scale:2,backgroundColor:"#ffffff"});c.toBlob(b=>{dl(b,fname("png"));toast("Gambar diunduh","ok");notify("ekspor","Laporan diunduh (gambar PNG)",fmtFull(Date.now()))})};

  <div class="card"><h3>Riwayat Pembayaran</h3><div class="tw"><table><thead><tr><th>Tanggal</th><th>Paket</th><th class="right">Jumlah</th><th>Status</th><th>ID</th></tr></thead><tbody>${S.payments.slice().sort((a,b)=>b.ts-a.ts).map(p=>`<tr><td>${fmtFull(p.ts)}</td><td>${planLabel(p.plan)}</td><td class="right">${fmt(p.amount)}</td><td><span class="badge ${p.status==="paid"?"b-ok":p.status==="pending"?"b-warn":"b-bad"}">${p.status==="paid"?"Lunas":p.status==="pending"?"Menunggu konfirmasi":"Ditolak"}</span></td><td class="small">${p.id.slice(0,8).toUpperCase()}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Belum ada pembayaran</td></tr>'}</tbody></table></div></div>`}};
A.buy=async el=>{const plan=el.dataset.plan,amount=plan==="yearly"?CONFIG.PRICE_YEAR:CONFIG.PRICE_MONTH;
  if(!(await ask("Konfirmasi paket",`Paket <b>${planLabel(plan)}</b> seharga <b>${fmt(amount)}</b>. Lanjut membuat tagihan?`,"Buat Tagihan")))return;
  const ref=await addDoc(collection(db,"payments"),{uid:uid(),email:S.user.email,name:S.P.ownerName||"",plan,amount,status:"pending",referrerUid:S.P.referredBy||"",ts:Date.now()});const code=ref.id.slice(0,8).toUpperCase();
  notify("pembayaran","Tagihan dibuat: "+planLabel(plan),`${fmt(amount)} · ID ${code} · menunggu pembayaran & konfirmasi`);
  modal("Selesaikan Pembayaran",`<p>Tagihan <b>${planLabel(plan)}</b> sebesar <b>${fmt(amount)}</b> dibuat. ID: <b>${code}</b></p><div class="locked" style="background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a">${esc(CONFIG.PAY_INFO)}</div><p class="small mut">Setelah transfer, kirim bukti bayar melalui WhatsApp. Akun diaktifkan setelah admin mengonfirmasi.</p><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Tutup</button><a class="btn green" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.WHATSAPP_ADMIN}?text=${encodeURIComponent(`Halo admin, saya sudah bayar WebKasir Kita.\nID: ${code}\nPaket: ${planLabel(plan)} (${fmt(amount)})\nEmail: ${S.user.email}`)}">Konfirmasi via WhatsApp</a></div>`)};

/* ---------- Admin ---------- */
PAGES.admin={title:"Admin",html(){return `<div class="card"><h3>Pembayaran menunggu konfirmasi (${S.adminPay.length})</h3><div class="tw"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Paket</th><th class="right">Jumlah</th><th>ID</th><th></th></tr></thead><tbody>${S.adminPay.map(p=>`<tr><td>${fmtFull(p.ts)}</td><td>${esc(p.name)}<br><span class="small mut">${esc(p.email)}</span></td><td>${planLabel(p.plan)}</td><td class="right">${fmt(p.amount)}</td><td>${p.id.slice(0,8).toUpperCase()}</td><td style="white-space:nowrap"><button class="btn green sm" data-act="approve" data-id="${p.id}">Setujui</button> <button class="btn red sm" data-act="reject" data-id="${p.id}">Tolak</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">Tidak ada</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Penarikan komisi (${S.adminPayouts.length})</h3><div class="tw"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Tujuan</th><th class="right">Jumlah</th><th></th></tr></thead><tbody>${S.adminPayouts.map(p=>`<tr><td>${fmtFull(p.ts)}</td><td>${esc(p.name)}</td><td>${esc(p.bank)}</td><td class="right">${fmt(p.amount)}</td><td><button class="btn green sm" data-act="payoutDone" data-id="${p.id}">Tandai dibayar</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Tidak ada</td></tr>'}</tbody></table></div></div>`}};
const notifyOther=(u,type,title,body)=>addDoc(collection(db,"users",u,"notifications"),{type,title,body,ts:Date.now(),read:false,meta:{}}).catch(()=>{});
A.approve=async el=>{const p=S.adminPay.find(x=>x.id===el.dataset.id);if(!p||!(await ask("Setujui pembayaran",`${esc(p.email)} · ${planLabel(p.plan)} · ${fmt(p.amount)}`,"Setujui","green")))return;
  try{const us=await getDoc(doc(db,"users",p.uid)),u=us.data(),base=Math.max(Date.now(),u.plan?.expiresAt||0),d=new Date(base);d.setMonth(d.getMonth()+(p.plan==="yearly"?12:1));
    await updateDoc(doc(db,"users",p.uid),{plan:{type:p.plan,expiresAt:d.getTime()}});await updateDoc(doc(db,"payments",p.id),{status:"paid",approvedAt:Date.now()});
    await notifyOther(p.uid,"pembayaran","Pembayaran dikonfirmasi ✅",`Paket ${planLabel(p.plan)} aktif sampai ${fmtDate(ds(d))}.`);
    if(p.referrerUid){const c=Math.floor(p.amount*CONFIG.COMMISSION);await updateDoc(doc(db,"users",p.referrerUid),{referralBalance:increment(c),referralEarned:increment(c)});
      const rs=await getDocs(query(collection(db,"referrals"),where("referredUid","==",p.uid)));for(const r of rs.docs)await updateDoc(r.ref,{status:"berbayar",paidAmount:increment(p.amount),commission:increment(c)});
      await notifyOther(p.referrerUid,"referral","Komisi referal masuk 🎉",`${p.name||p.email} berlangganan ${planLabel(p.plan)} (${fmt(p.amount)}). Komisi ${CONFIG.COMMISSION*100}% = ${fmt(c)} masuk ke saldo komisi Anda.`)}
    toast("Pembayaran disetujui","ok")}catch(e){toast("Gagal: "+e.message,"bad")}};
A.reject=async el=>{const p=S.adminPay.find(x=>x.id===el.dataset.id);if(p&&await ask("Tolak pembayaran","Tandai tagihan ini ditolak?","Tolak","red")){await updateDoc(doc(db,"payments",p.id),{status:"rejected"});notifyOther(p.uid,"pembayaran","Pembayaran ditolak","Tagihan "+p.id.slice(0,8).toUpperCase()+" ditolak. Hubungi admin.")}};
A.payoutDone=async el=>{const p=S.adminPayouts.find(x=>x.id===el.dataset.id);if(!p||!(await ask("Konfirmasi","Pastikan Anda sudah mentransfer "+fmt(p.amount)+" ke "+esc(p.bank),"Sudah dibayar","green")))return;
  await updateDoc(doc(db,"payouts",p.id),{status:"dibayar",paidAt:Date.now()});await updateDoc(doc(db,"users",p.uid),{referralBalance:increment(-p.amount)});notifyOther(p.uid,"referral","Penarikan komisi dibayar",fmt(p.amount)+" telah ditransfer ke "+p.bank);toast("Ditandai dibayar","ok")};

/* ---------- Pengaturan ---------- */
PAGES.pengaturan={title:"Pengaturan",html(){const P=S.P;return `
  <div class="card"><h3>Profil & Bisnis</h3><div class="row gap wrap" style="margin-bottom:14px"><div class="ph" id="phBox">${P.photo?`<img src="${P.photo}" alt="">`:esc((P.ownerName||"U")[0].toUpperCase())}</div><div><button class="btn ghost sm" id="photoBtn">Ganti foto profil</button><input type="file" id="photoIn" accept="image/*" hidden><p class="small mut" style="margin:6px 0 0">Foto otomatis diperkecil. ${P.photo?'<a href="#" data-act="rmPhoto">Hapus foto</a>':""}</p></div></div>
   <div class="grid two" style="margin:0"><label class="f">Nama pemilik<input id="sOwner" class="in" value="${esc(P.ownerName)}"></label><label class="f">Nama bisnis<input id="sBiz" class="in" value="${esc(P.businessName)}"></label><label class="f">Nama cabang<input id="sBranch" class="in" value="${esc(P.branchName)}" placeholder="mis. Cabang Serang"></label><label class="f">No. WhatsApp/Telepon<input id="sPhone" class="in" value="${esc(P.phone)}"></label></div>
   <label class="f">Alamat cabang / bisnis<textarea id="sAddr" class="in" rows="2">${esc(P.address)}</textarea></label><label class="f">Saldo awal / modal kas (Rp)<input id="sOpen" class="in" type="number" min="0" value="${P.openingBalance||0}"></label><label class="f">Email login<input class="in" value="${esc(S.user.email)}" disabled></label><button class="btn" data-act="saveSettings">Simpan Pengaturan</button></div>
  <div class="card" id="secBox"><h3>🔐 Keamanan · Sandi Hapus Transaksi</h3><p class="mut">Menghapus data transaksi wajib memakai sandi ini. ${P.deletePin?"Sandi sudah dibuat.":"<b>Sandi belum dibuat.</b>"}</p><button class="btn" data-act="${P.deletePin?"pwChange":"pwCreate"}">${P.deletePin?"Ganti Sandi":"Buat Sandi"}</button></div>
  <div class="card"><h3>🎁 Bagikan ke Teman</h3><p class="mut">Kode referal: <span class="code" style="font-size:16px;padding:3px 10px">${esc(P.referralCode)}</span></p><div class="linkbox"><input class="in" readonly value="${esc(refLink())}"><button class="btn" data-act="copy" data-v="${esc(refLink())}">Salin</button></div><p class="small mut" style="margin-top:8px">Dapat ${CONFIG.COMMISSION*100}% dari pembayaran teman yang daftar lewat link ini. <a href="#" data-act="nav" data-p="referral">Lihat detail</a></p></div>
  <div class="card"><h3>Lainnya</h3><div class="row gap wrap"><button class="btn ghost" data-act="replayTour">▶ Ulangi tutorial</button><button class="btn ghost" data-act="nav" data-p="langganan">⭐ Langganan</button><button class="btn red" data-act="logout">Keluar</button></div></div>`},
  after(){const b=$("#photoBtn"),i=$("#photoIn");b.onclick=()=>i.click();i.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await updateDoc(doc(db,"users",uid()),{photo:await resizePhoto(f)});toast("Foto profil diperbarui","ok");notify("pengaturan","Foto profil diperbarui",fmtFull(Date.now()))}catch(x){toast(x.message,"bad")}}}};
A.rmPhoto=async()=>{await updateDoc(doc(db,"users",uid()),{photo:""});notify("pengaturan","Foto profil dihapus",fmtFull(Date.now()))};
A.saveSettings=async()=>{const d={ownerName:$("#sOwner").value.trim(),businessName:$("#sBiz").value.trim(),branchName:$("#sBranch").value.trim(),phone:$("#sPhone").value.trim(),address:$("#sAddr").value.trim(),openingBalance:num($("#sOpen").value)};const ch=Object.keys(d).filter(k=>d[k]!==S.P[k]);
  await updateDoc(doc(db,"users",uid()),d);toast("Pengaturan disimpan","ok");if(ch.length)notify("pengaturan","Pengaturan diubah","Bagian yang diubah: "+ch.map(k=>({ownerName:"nama pemilik",businessName:"nama bisnis",branchName:"cabang",phone:"telepon",address:"alamat",openingBalance:"saldo awal"}[k])).join(", "))};
A.replayTour=()=>{go("dashboard");setTimeout(startTour,300)};

/* ---------- Sandi: buat & ganti ---------- */
A.pwCreate=()=>modal("Buat Sandi Hapus",`<p class="small mut">Sandi ini terpisah dari sandi login. Minimal 6 karakter. Ketik 3 kali untuk verifikasi.</p><label class="f">Sandi baru<input id="p1" class="in" type="password" autocomplete="new-password"></label><label class="f">Verifikasi sandi (1)<input id="p2" class="in" type="password" autocomplete="new-password"></label><label class="f">Verifikasi sandi (2)<input id="p3" class="in" type="password" autocomplete="new-password"></label><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Batal</button><button class="btn" data-act="pwSave" data-mode="create">Simpan Sandi</button></div>`);
A.pwChange=()=>modal("Ganti Sandi Hapus",`<div id="stepOld"><p class="small mut">Langkah 1: verifikasi sandi lama.</p><label class="f">Sandi lama<input id="po" class="in" type="password" autocomplete="off"></label><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Batal</button><button class="btn" data-act="pwVerifyOld">Verifikasi</button></div></div><div id="stepNew" hidden><p class="small pos"><b>✓ Sandi lama terverifikasi.</b> Langkah 2: masukkan sandi baru lalu verifikasi 2 kali.</p><label class="f">Sandi baru<input id="p1" class="in" type="password" autocomplete="new-password"></label><label class="f">Verifikasi sandi baru (1)<input id="p2" class="in" type="password" autocomplete="new-password"></label><label class="f">Verifikasi sandi baru (2)<input id="p3" class="in" type="password" autocomplete="new-password"></label><div class="actions"><button class="btn ghost" data-act="mclose" data-x="1">Batal</button><button class="btn" data-act="pwSave" data-mode="change">Simpan Sandi Baru</button></div></div>`);
A.pwVerifyOld=async el=>{if(Date.now()<S.lockUntil)return toast("Terkunci sementara. Coba beberapa saat lagi.","bad");const v=$("#po").value;if(!v)return toast("Masukkan sandi lama","bad");el.disabled=true;
  if(await checkPw(v)){S.fails=0;S.oldOk=true;$("#stepOld").hidden=true;$("#stepNew").hidden=false;$("#p1").focus();notify("keamanan","Sandi lama terverifikasi","Proses penggantian sandi hapus dimulai "+fmtFull(Date.now()))}
  else{el.disabled=false;S.fails++;notify("sandi_salah","❌ Sandi lama salah saat ganti sandi",`Percobaan ke-${S.fails} pada ${fmtFull(Date.now())}`);if(S.fails>=5){S.lockUntil=Date.now()+60000;S.fails=0;notify("keamanan","Penggantian sandi dikunci 60 detik","5 kali salah memasukkan sandi lama.")}toast("Sandi lama salah","bad")}};
A.pwSave=async el=>{const mode=el.dataset.mode,a=$("#p1").value,b=$("#p2").value,c=$("#p3").value;
  if(mode==="change"&&!S.oldOk)return toast("Verifikasi sandi lama dulu","bad");
  if(a.length<6)return toast("Sandi minimal 6 karakter","bad");if(a!==b||a!==c)return toast("Verifikasi sandi tidak sama","bad");
  el.disabled=true;await updateDoc(doc(db,"users",uid()),{deletePin:await hashPw(a)});S.oldOk=false;closeModal(1);toast("Sandi hapus disimpan","ok");
  notify("keamanan",mode==="create"?"Sandi hapus dibuat":"Sandi hapus diganti","Pada "+fmtFull(Date.now())+". Penghapusan transaksi sekarang memakai sandi ini.")};

/* ====================== TUR TUTORIAL ====================== */
const TOUR=[
 {center:1,title:"Selamat datang di WebKasir Kita 👋",text:"Kami pandu singkat semua tombol penting. Tutorial ini hanya muncul sekali."},
 {sel:'[data-nav="dashboard"]',page:"dashboard",title:"Dashboard",text:"Lihat omzet, HPP, margin, laba, saldo, dan grafik penjualan sekilas."},
 {sel:"#statGrid",page:"dashboard",title:"Ringkasan keuangan",text:"Saldo saat ini, omzet, HPP, laba kotor, margin, dan laba bersih dihitung otomatis."},
 {sel:'[data-nav="kasir"]',title:"Menu Kasir",text:"Tempat mencatat penjualan paling cepat."},
 {sel:"#qtyBox",page:"kasir",title:"Jumlah, tanggal & metode",text:"Atur jumlah, tanggal pencatatan, dan metode bayar sebelum mengklik produk."},
 {sel:"#tiles",page:"kasir",title:"Catat penjualan 1 klik",text:"Klik satu produk = penjualan tercatat lengkap (modal, harga jual, untung, tanggal, jam) dan stok berkurang."},
 {sel:"#btnAddProduct",page:"produk",title:"Tambah produk",text:"Isi nama, harga modal, harga jual, dan stok awal. Hapus produk wajib sandi."},
 {sel:"#stokSummary",page:"stok",title:"Stok",text:"Pantau nilai stok dan produk yang menipis. Gunakan Restock saat barang masuk."},
 {sel:"#salesTable",page:"penjualan",title:"Data penjualan",text:"Semua transaksi tersimpan di sini. Tombol Hapus akan meminta sandi dan setiap percobaannya masuk notifikasi."},
 {sel:"#btnAddExpense",page:"pengeluaran",title:"Catat pengeluaran",text:"Biaya operasional diambil dari saldo hasil penjualan, jadi laba bersih selalu akurat."},
 {sel:"#exportBtns",page:"laporan",title:"Unduh laporan",text:"Unduh data transaksi sebagai CSV, PDF, atau gambar PNG."},
 {sel:"#bell",title:"Notifikasi",text:"Semua kejadian masuk ke sini: stok menipis, percobaan hapus data, masa premium, dan lainnya."},
 {sel:"#avatar",title:"Profil & pengaturan",text:"Klik foto/inisial Anda di sini kapan saja untuk mengatur profil, nama bisnis, alamat cabang, dan sandi hapus."},
 {sel:"#refBox",page:"referral",title:"Referral 25%",text:"Bagikan link atau kode referal. Anda dapat 25% dari pembayaran teman yang berlangganan."},
 {sel:"#secBox",page:"pengaturan",title:"Sandi hapus",text:"Buat sandi hapus di sini. Mengganti sandi harus memverifikasi sandi lama dulu."},
 {center:1,title:"Selesai! 🎉",text:"Mulai dengan menambah produk, lalu catat penjualan di Kasir. Selamat berjualan!"}
];
async function startTour(){S.tour=true;let i=0;const root=$("#tourRoot");
  const end=async()=>{root.innerHTML="";S.tour=false;S.endTour=null;if(!S.P.tourDone){await updateDoc(doc(db,"users",uid()),{tourDone:true}).catch(()=>{});notify("info","Tutorial selesai","Anda bisa mengulang tutorial dari menu Pengaturan.")}};
  S.endTour=end;
  const show=async()=>{try{await step()}catch(e){console.warn("tour",e);end()}};
  const step=async()=>{const st=TOUR[i];if(st.page&&S.page!==st.page){go(st.page);await sleep(250)}
    let el=st.sel?$(st.sel):null;
    if(el&&el.closest(".side")){if(isMobile()){$("#side").classList.add("open");$("#backdrop").classList.add("open")}}else if(isMobile()){$("#side")?.classList.remove("open");$("#backdrop")?.classList.remove("open")}
    if(el&&!el.closest(".side")&&!el.closest(".top"))el.scrollIntoView({block:"center"});await sleep(260);
    const r=el&&!st.center?el.getBoundingClientRect():null,last=i===TOUR.length-1;
    root.innerHTML=`<div class="tblock"></div><div class="thole" id="th"></div><div class="tpop" id="tp"><h4>${st.title}</h4><p>${st.text}</p><div class="tdots">${TOUR.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div><div class="row between"><button class="btn ghost sm" id="tSkip">${last?"":"Lewati"}</button><div class="row gap">${i>0?'<button class="btn ghost sm" id="tPrev">Kembali</button>':""}<button class="btn sm" id="tNext">${last?"Mulai":"Lanjut"}</button></div></div></div>`;
    const th=$("#th"),tp=$("#tp");
    if(r){const p=6;Object.assign(th.style,{left:r.left-p+"px",top:r.top-p+"px",width:r.width+p*2+"px",height:r.height+p*2+"px"})}else Object.assign(th.style,{left:innerWidth/2+"px",top:innerHeight/2+"px",width:"0px",height:"0px"});
    const ph=tp.offsetHeight,pw=tp.offsetWidth;let x,y;
    if(r){x=Math.min(Math.max(12,r.left),innerWidth-pw-12);if(r.bottom+ph+20<innerHeight)y=r.bottom+16;else if(r.top-ph-20>0)y=r.top-ph-16;else{y=innerHeight-ph-14;x=Math.min(Math.max(12,innerWidth-pw-14),innerWidth-pw-12)}}
    else{x=(innerWidth-pw)/2;y=(innerHeight-ph)/2}
    tp.style.left=x+"px";tp.style.top=Math.min(Math.max(10,y),Math.max(10,innerHeight-ph-10))+"px";
    $("#tNext").onclick=()=>{if(last)return end();i++;show()};const pv=$("#tPrev");if(pv)pv.onclick=()=>{i--;show()};const sk=$("#tSkip");if(sk)sk.onclick=end;
  };show()}

/* ---- navigasi lewat tombol back/forward browser ---- */
addEventListener("hashchange",()=>{if(!S.P||!$("#main"))return;const h=location.hash.replace("#/","");if(h&&h!==S.page&&(NAV.some(n=>n[0]===h)||(h==="admin"&&isAdmin()))){S.page=h;renderPage(true)}});
